name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lihtc-site-selection
      - uses: actions/checkout@v4
        with:
          repository: kmcalist682336/SitelineLIHTCStartUp
          path: SitelineLIHTCStartUp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lihtc-site-selection/requirements.txt
      - name: Install
        run: |
          pip install -e "SitelineLIHTCStartUp[geo]"
          pip install -r lihtc-site-selection/requirements.txt
      - name: Test
        working-directory: lihtc-site-selection
        run: for f in tests/test_*.py; do echo "== $f"; python "$f" || exit 1; done
